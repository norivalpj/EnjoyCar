[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/extract-data"
  to = "/.netlify/functions/extract-data"
  status = 200

[[redirects]]
  from = "/api/search-places"
  to = "/.netlify/functions/search-places"
  status = 200

[[redirects]]
  from = "/api/invoke-llm"
  to = "/.netlify/functions/invoke-llm"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
