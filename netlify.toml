[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRET_SCANNING_DISABLED = "true"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/extract-data"
  to = "/.netlify/functions/extract-data"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
